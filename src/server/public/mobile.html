<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MağazaPOS - Mobil Depo & Stok Kontrol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen antialiased select-none">
  <!-- Corporate Dark Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 px-4 py-3 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div className="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-bold text-xs tracking-wider">
          POS
        </div>
        <div>
          <h1 class="font-bold text-white text-sm leading-tight">MağazaPOS Mobil</h1>
          <span class="text-[10px] text-slate-400 font-medium">Mobil Depo & Stok Sorgulama</span>
        </div>
      </div>
      <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold flex items-center space-x-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse inline-block"></span>
        <span>Wi-Fi Canlı</span>
      </span>
    </div>
  </header>

  <!-- Main Search Container -->
  <main class="max-w-md mx-auto p-3.5 space-y-3">
    <!-- Search Box -->
    <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-2xs space-y-1.5">
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-tight">Ürün / Barkod / Beden Ara</label>
      <div class="relative">
        <input
          id="searchInput"
          type="text"
          placeholder="Barkod okutun veya ürün adı yazın..."
          class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded text-slate-900 font-semibold text-xs focus:outline-none focus:ring-1 focus:ring-blue-600 focus:bg-white transition"
        />
      </div>
    </div>

    <!-- Results List -->
    <div id="resultsContainer" class="space-y-2">
      <div class="text-center py-8 text-slate-400 text-xs font-medium">
        Yükleniyor...
      </div>
    </div>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');

    async function fetchStock(query = '') {
      try {
        const res = await fetch(`/api/mobile/search?q=${encodeURIComponent(query)}`);
        const variants = await res.json();

        if (!variants || variants.length === 0) {
          resultsContainer.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-lg p-5 text-center text-slate-500 text-xs font-medium shadow-2xs">
              Eşleşen ürün bulunamadı.
            </div>
          `;
          return;
        }

        resultsContainer.innerHTML = variants.map(v => {
          const color = v.attributes?.color || '-';
          const size = v.attributes?.size || '-';
          const isHigh = v.stockQuantity > 10;
          const isMid = v.stockQuantity > 0;

          return `
            <div class="bg-white border border-slate-200 rounded-lg p-3 shadow-2xs space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-bold text-blue-700 uppercase tracking-tight">${v.product?.category?.name || 'Giyim'}</span>
                  <h3 class="font-bold text-slate-900 text-xs">${v.product?.name || 'Ürün'}</h3>
                  <p class="text-[11px] text-slate-500 font-mono">${v.product?.code || ''}</p>
                </div>
                <div class="text-right">
                  <span class="px-2 py-0.5 rounded text-[11px] font-bold border ${
                    isHigh
                      ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                      : isMid
                      ? 'bg-amber-50 text-amber-800 border-amber-200'
                      : 'bg-rose-50 text-rose-800 border-rose-200'
                  }">
                    ${v.stockQuantity} Adet
                  </span>
                  <span class="block text-xs font-bold text-slate-900 mt-1">${Number(v.salePrice).toFixed(2)} ₺</span>
                </div>
              </div>

              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                <div class="flex items-center space-x-1.5">
                  <span class="px-2 py-0.5 bg-slate-100 text-slate-800 rounded text-[11px] font-semibold border border-slate-200">
                    Renk: ${color}
                  </span>
                  <span class="px-2 py-0.5 bg-slate-100 text-slate-800 rounded text-[11px] font-semibold border border-slate-200">
                    Beden: ${size}
                  </span>
                </div>
                <span class="font-mono text-[10px] text-slate-500 font-semibold">${v.barcode}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        resultsContainer.innerHTML = `<div class="text-rose-600 text-center text-xs font-bold py-4">Yükleme Hatası</div>`;
      }
    }

    let timer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => fetchStock(e.target.value), 300);
    });

    fetchStock('');
  </script>
</body>
</html>
