<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MağazaPOS - Mobil Depo & Stok Kontrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-sm">
          POS
        </div>
        <div>
          <h1 class="font-extrabold text-slate-900 text-sm leading-none">MağazaPOS Mobil</h1>
          <span class="text-[10px] text-indigo-600 font-bold">Depo Stok Sorgu</span>
        </div>
      </div>
      <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">
        Wi-Fi Canlı
      </span>
    </div>
  </header>

  <!-- Main Search Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Search Box -->
    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
      <label class="block text-xs font-bold text-slate-600">Ürün / Barkod / Beden Ara</label>
      <input
        id="searchInput"
        type="text"
        placeholder="Barkod okutun veya tişört, kazak yazın..."
        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <!-- Results List -->
    <div id="resultsContainer" class="space-y-3">
      <div class="text-center py-8 text-slate-400 text-xs font-medium">
        Yükleniyor...
      </div>
    </div>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');

    async function fetchStock(query = '') {
      try {
        const res = await fetch(`/api/mobile/search?q=${encodeURIComponent(query)}`);
        const variants = await res.json();

        if (!variants || variants.length === 0) {
          resultsContainer.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-2xl p-6 text-center text-slate-500 text-xs font-medium shadow-sm">
              Eşleşen ürün bulunamadı.
            </div>
          `;
          return;
        }

        resultsContainer.innerHTML = variants.map(v => {
          const color = v.attributes?.color || '-';
          const size = v.attributes?.size || '-';
          const isHigh = v.stockQuantity > 10;
          const isMid = v.stockQuantity > 0;

          return `
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-bold text-indigo-600 uppercase">${v.product?.category?.name || 'Giyim'}</span>
                  <h3 class="font-extrabold text-slate-900 text-sm">${v.product?.name || 'Ürün'}</h3>
                  <p class="text-xs text-slate-500 font-mono">${v.product?.code || ''}</p>
                </div>
                <div class="text-right">
                  <span class="px-2.5 py-1 rounded-full text-xs font-black border ${
                    isHigh
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                      : isMid
                      ? 'bg-amber-50 text-amber-700 border-amber-200'
                      : 'bg-rose-50 text-rose-700 border-rose-200'
                  }">
                    ${v.stockQuantity} Adet
                  </span>
                  <span class="block text-xs font-black text-slate-900 mt-1">${v.salePrice} ₺</span>
                </div>
              </div>

              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                <div class="flex items-center space-x-2">
                  <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-bold border border-indigo-100">
                    Renk: ${color}
                  </span>
                  <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-bold border border-indigo-100">
                    Beden: ${size}
                  </span>
                </div>
                <span class="font-mono text-[10px] text-slate-400 font-bold">${v.barcode}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        resultsContainer.innerHTML = `<div class="text-rose-600 text-center text-xs">Yükleme Hatası</div>`;
      }
    }

    let timer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => fetchStock(e.target.value), 300);
    });

    fetchStock('');
  </script>
</body>
</html>
