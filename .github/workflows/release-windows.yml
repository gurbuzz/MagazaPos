name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayımlanacak mevcut sürüm etiketi (ör. v1.0.1)'
        required: true
        default: 'v1.0.5'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DATABASE_URL: 'file:./dev.db'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npx prisma generate
      - run: npm run test:updates
      - run: node --import tsx tests/exchanges.test.ts
      - run: npm run test:sales
      - run: npm run test:gift-vouchers
  release:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) throw Error('Tag and package version must match')"
      - run: npm ci --include=dev
      - run: npx prisma generate
      - name: Create empty installer database in disposable runner
        run: node scripts/prepare-release-db.cjs
      - name: Build Windows installer without publishing
        run: npm run package:win -- --publish never
      - name: Verify installer, updater dependency and manifest
        run: node scripts/verify-windows-release.cjs
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagazaPOS-Windows-${{ env.RELEASE_TAG }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "MagazaPOS $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
