<!DOCTYPE html>
<html lang="tr" class="h-full w-full overflow-hidden">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUFIAN - Müşteri Ekranı</title>
  <link rel="icon" type="image/png" href="/lufian-og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slowMotionSlideUp {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
        filter: blur(3px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes slowMotionFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.985);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulseSoftRing {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35);
      }

      50% {
        box-shadow: 0 0 0 16px rgba(59, 130, 246, 0);
      }
    }

    @keyframes pulseEmeraldSoft {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.35);
      }

      50% {
        box-shadow: 0 0 0 14px rgba(16, 185, 129, 0);
      }
    }

    @keyframes lightSweepSlow {
      0% {
        transform: translateX(-160%) skewX(-25deg);
        opacity: 0;
      }

      25% {
        opacity: 0.95;
      }

      65% {
        opacity: 0.85;
      }

      100% {
        transform: translateX(260%) skewX(-25deg);
        opacity: 0;
      }
    }

    @keyframes checkoutPanelLeftSlow {
      0% {
        transform: translateX(-45px) scale(0.96);
        opacity: 0;
        filter: blur(8px);
      }

      100% {
        transform: translateX(0) scale(1);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes checkoutPanelRightSlow {
      0% {
        transform: translateX(45px) scale(0.96);
        opacity: 0;
        filter: blur(8px);
      }

      100% {
        transform: translateX(0) scale(1);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes portalCardIn {
      0% {
        transform: scale(0.85);
        opacity: 0;
        filter: blur(10px);
      }

      12% {
        transform: scale(1.02);
        opacity: 1;
        filter: blur(0);
      }

      88% {
        transform: scale(1);
        opacity: 1;
        filter: blur(0);
      }

      100% {
        transform: scale(1.08) translateY(-15px);
        opacity: 0;
        filter: blur(8px);
      }
    }

    .animate-slowmotion-enter {
      animation: slowMotionSlideUp 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-slowmotion-fade {
      animation: slowMotionFadeIn 650ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-soft-ring {
      animation: pulseSoftRing 2.8s ease-in-out infinite;
    }

    .animate-emerald-ring {
      animation: pulseEmeraldSoft 2.8s ease-in-out infinite;
    }

    .animate-light-sweep {
      animation: lightSweepSlow 2350ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-panel-left {
      animation: checkoutPanelLeftSlow 1350ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-panel-right {
      animation: checkoutPanelRightSlow 1350ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-portal-card {
      animation: portalCardIn 2350ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body
  class="h-full w-full bg-gradient-to-br from-[#0c1322] via-[#101b33] to-[#0c1424] text-white select-none overflow-hidden flex flex-col relative text-base m-0 p-0">

  <!-- Ambient Light (Balanced twilight atmosphere) -->
  <div
    class="absolute -top-32 -left-32 w-[420px] h-[420px] bg-blue-600/20 rounded-full blur-[110px] pointer-events-none">
  </div>
  <div
    class="absolute -bottom-32 -right-32 w-[420px] h-[420px] bg-indigo-600/15 rounded-full blur-[110px] pointer-events-none">
  </div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[380px] bg-sky-500/10 rounded-full blur-[120px] pointer-events-none">
  </div>

  <!-- Slower Fullscreen Light Sweep Layer -->
  <div id="sweepLayer" class="hidden absolute inset-0 pointer-events-none z-50 overflow-hidden">
    <div
      class="w-[50%] h-full bg-gradient-to-r from-transparent via-cyan-400/35 via-blue-500/40 to-transparent blur-3xl animate-light-sweep">
    </div>
  </div>

  <!-- High-Impact Eye-Catching Transition Portal Card -->
  <div id="transitionPortal"
    class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center pointer-events-none animate-portal-card">
    <div
      class="relative p-7 rounded-3xl bg-slate-900/90 border border-blue-400/50 shadow-2xl backdrop-blur-2xl flex flex-col items-center space-y-3.5 max-w-sm text-center">
      <div class="absolute inset-0 rounded-3xl bg-blue-500/20 blur-xl animate-pulse"></div>
      <div
        class="relative bg-white h-13 px-6 rounded-2xl shadow-xl border border-white/95 flex items-center justify-center space-x-3.5">
        <img src="./lufian-og.png" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='/lufian-og.png';}"
          alt="LUFIAN" class="h-7 w-auto max-w-[110px] object-contain select-none" />
        <div class="h-5 w-px bg-slate-300"></div>
        <img src="./org_logo.svg" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='/org_logo.svg';}"
          alt="JACK & JONES" class="h-4.5 w-auto max-w-[125px] object-contain select-none" />
      </div>
      <div class="relative flex items-center space-x-2 text-blue-300 text-base font-black tracking-wider uppercase">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping"></span>
        <span id="transitionPortalText">Ödeme Aşaması Aktifleştiriliyor</span>
      </div>
      <div class="relative text-sm text-blue-200/90 font-medium">Lütfen Bekleyiniz • Güvenli Terminal Hazırlandı</div>
    </div>
  </div>

  <!-- Header: Centered Brands Logo Pill & Clock -->
  <header
    class="h-[64px] bg-slate-900/70 backdrop-blur-2xl border-b border-white/10 px-5 md:px-7 flex items-center justify-between z-20 shrink-0 shadow-lg relative">
    <!-- Left: Customer Greeting or Active Status Pill -->
    <div class="flex items-center shrink-0 min-w-[180px] max-w-[320px]">
      <div id="customerGreeting"
        class="hidden flex items-center space-x-2.5 bg-white/10 border border-white/15 px-3.5 py-1.5 rounded-xl backdrop-blur-xl shadow-md">
      </div>
      <div id="defaultKasaBadge"
        class="flex items-center space-x-2 bg-white/[0.06] border border-white/12 px-3.5 py-1.5 rounded-xl text-blue-200/90 shadow-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-black text-xs md:text-sm text-blue-100 uppercase tracking-wide">Kasa Aktif</span>
      </div>
    </div>

    <!-- Center: Mathematically Centered Both Logos Pill -->
    <div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center pointer-events-auto">
      <div
        class="bg-white h-12 md:h-13 px-5 md:px-7 rounded-2xl shadow-2xl flex items-center justify-center space-x-3 md:space-x-4 border border-white/95 shrink-0 transition-transform">
        <img src="./lufian-og.png" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='/lufian-og.png';}"
          alt="LUFIAN" class="h-6 md:h-7 w-auto max-w-[105px] md:max-w-[125px] object-contain select-none" />
        <div class="h-5 md:h-6 w-px bg-slate-300"></div>
        <img src="./org_logo.svg" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='/org_logo.svg';}"
          alt="JACK & JONES" class="h-4 md:h-5 w-auto max-w-[115px] md:max-w-[140px] object-contain select-none" />
      </div>
    </div>

    <!-- Right: Clock & Date Only -->
    <div class="text-right shrink-0 min-w-[180px]">
      <div id="liveClock" class="text-xl md:text-2xl font-black font-mono tracking-wider text-white leading-tight">
        --:--:--</div>
      <div id="liveDate" class="text-[11px] md:text-xs font-bold text-blue-200 capitalize">--</div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="mainContainer" class="flex-1 flex overflow-hidden p-3 md:p-4 z-10 gap-3 md:gap-4 min-h-0">
    <!-- Populated dynamically by JS -->
  </main>

  <!-- Footer: Crisp, Legible Footer Pinned to Bottom -->
  <footer
    class="h-7 bg-slate-900/85 backdrop-blur-2xl border-t border-white/10 px-5 flex items-center justify-between text-[11px] text-blue-300/80 z-10 shrink-0">
    <div class="flex items-center space-x-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-bold text-blue-100">Kasa Aktif & Canlı Bağlantı</span>
    </div>
    <div>
      <span class="text-[10px] md:text-[11px] text-blue-300/60 font-semibold tracking-wider uppercase">
        Design & Architecture by Atacan Gürbüz
      </span>
    </div>
  </footer>

  <script>
    let state = {
      status: 'idle',
      storeName: 'JACK & JONES',
      cartItems: [],
      subtotal: 0,
      discountAmount: 0,
      surchargeAmount: 0,
      total: 0,
      activeCampaign: null,
      selectedCustomer: null,
      paymentInfo: null,
      hidePrices: localStorage.getItem('pos_stock_only_mode') === 'true'
    };

    let prevStatus = 'idle';

    function triggerTransitionAnimation(text) {
      const sweep = document.getElementById('sweepLayer');
      const portal = document.getElementById('transitionPortal');
      const portalText = document.getElementById('transitionPortalText');

      if (sweep) {
        sweep.classList.remove('hidden');
        setTimeout(() => sweep.classList.add('hidden'), 2350);
      }
      if (portal && portalText && text) {
        portalText.textContent = text;
        portal.classList.remove('hidden');
        setTimeout(() => portal.classList.add('hidden'), 2350);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const PROMOS = [
      {
        badge: 'YENİ SEZON',
        badgeColor: 'bg-blue-500/20 text-blue-300 border-blue-400/30',
        iconBg: 'bg-blue-600/80 text-white',
        icon: '🔥',
        title: 'Yeni Sezon Denim & Ceket Koleksiyonu',
        subtitle: 'En trend kesimler ve üstün Jack & Jones kumaş kalitesi sizleri bekliyor.'
      },
      {
        badge: 'KAMPANYA',
        badgeColor: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        iconBg: 'bg-amber-500/80 text-white',
        icon: '%',
        title: 'Avantajlı Kampanyalar & İndirimler',
        subtitle: 'Kasa görevlimizden güncel mağaza indirimleri ve çoklu alım fırsatlarını öğrenin.'
      },
      {
        badge: 'VIP CLUB',
        badgeColor: 'bg-purple-500/20 text-purple-300 border-purple-400/30',
        iconBg: 'bg-purple-600/80 text-white',
        icon: '🎁',
        title: 'Sadakat & VIP Müşteri Ayrıcalığı',
        subtitle: 'Telefon numaranızı ileterek size özel indirim ve kampanyalardan anında yararlanın.'
      },
      {
        badge: 'GÜVENLİ ÖDEME',
        badgeColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        iconBg: 'bg-emerald-600/80 text-white',
        icon: '🛡️',
        title: 'Hızlı & Güvenli Temassız Ödeme',
        subtitle: 'Tüm banka ve kredi kartları, Troy ve temassız mobil ödemeler geçerlidir.'
      }
    ];
    let promoIdx = 0;
    setInterval(() => {
      promoIdx = (promoIdx + 1) % PROMOS.length;
      if (state.status === 'idle' || (!state.cartItems || state.cartItems.length === 0)) {
        render();
      }
    }, 5000);

    function render() {
      const main = document.getElementById('mainContainer');
      const custGreet = document.getElementById('customerGreeting');

      // Check for screen transition from idle
      if (prevStatus !== state.status) {
        if (prevStatus === 'idle' && (state.status === 'checkout' || state.status === 'cart')) {
          triggerTransitionAnimation(state.status === 'checkout' ? 'Ödeme Aşaması Başlatılıyor' : 'Yeni Alışveriş Başlatıldı');
        } else if (state.status === 'checkout' && prevStatus !== 'checkout') {
          triggerTransitionAnimation('Ödeme & Tahsilat Aşaması');
        }
        prevStatus = state.status;
      }

      const defaultBadge = document.getElementById('defaultKasaBadge');
      if (state.selectedCustomer) {
        custGreet.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
          <span class="text-xs md:text-sm text-blue-200 font-semibold shrink-0">Sayın</span>
          <span class="text-base md:text-lg font-black text-white truncate">${state.selectedCustomer.firstName} ${state.selectedCustomer.lastName}</span>
          <span class="px-2.5 py-0.5 rounded-full bg-blue-500/30 text-blue-200 border border-blue-400/40 text-xs font-black uppercase shrink-0 shadow-2xs">VIP</span>
        `;
        custGreet.classList.remove('hidden');
        if (defaultBadge) defaultBadge.classList.add('hidden');
      } else {
        custGreet.innerHTML = '';
        custGreet.classList.add('hidden');
        if (defaultBadge) defaultBadge.classList.remove('hidden');
      }

      // 1. COMPLETED SALE CELEBRATION
      if (state.status === 'completed') {
        const changeDue = state.paymentInfo && state.paymentInfo.changeDue ? state.paymentInfo.changeDue : 0;
        main.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center p-6 bg-slate-900/60 border border-white/15 rounded-3xl backdrop-blur-2xl shadow-2xl animate-slowmotion-enter overflow-y-auto">
            <div class="w-24 h-24 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center mb-5 shadow-xl shadow-emerald-500/30 animate-bounce">
              <span class="text-5xl text-emerald-400 font-black">✓</span>
            </div>
            <span class="px-4 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 text-sm font-black uppercase tracking-wider mb-3">
              İşlem Başarılı
            </span>
            <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-2 tracking-tight">${state.hidePrices ? 'İşleminiz Başarıyla Tamamlandı!' : 'Ödemeniz Başarıyla Alındı!'}</h2>
            ${state.selectedCustomer ? `<div class="text-xl text-blue-300 font-extrabold mb-2">Sayın ${state.selectedCustomer.firstName} ${state.selectedCustomer.lastName}</div>` : ''}
            <p class="text-base md:text-lg text-blue-200/90 font-medium max-w-xl mb-7">
              Bizi tercih ettiğiniz için teşekkür eder, ürünlerinizi keyifle kullanmanızı dileriz.
            </p>
            <div class="bg-white/[0.06] border border-white/15 rounded-3xl p-6 w-full max-w-lg space-y-4 shadow-xl backdrop-blur-xl">
              ${state.paymentInfo?.receiptNo ? `
                <div class="flex justify-between items-center text-base border-b border-white/10 pb-3">
                  <span class="text-blue-200 font-semibold">Fiş Numarası:</span>
                  <span class="font-mono font-black text-white text-xl">${state.paymentInfo.receiptNo}</span>
                </div>
              ` : ''}
              ${!state.hidePrices ? `
                <div class="flex justify-between items-center text-lg pt-1">
                  <span class="font-bold text-white">Tahsil Edilen Toplam:</span>
                  <span class="text-3xl md:text-4xl font-black text-emerald-400">${Number(state.total).toFixed(2)} ₺</span>
                </div>
                ${changeDue > 0 ? `
                  <div class="p-4 bg-emerald-500/20 border border-emerald-400/40 rounded-2xl flex justify-between items-center mt-3 animate-emerald-ring">
                    <span class="text-sm font-black text-emerald-200 uppercase tracking-wide">Para Üstü:</span>
                    <span class="text-3xl font-black font-mono text-emerald-300">${Number(changeDue).toFixed(2)} ₺</span>
                  </div>
                ` : ''}
              ` : `
                <div class="flex justify-between items-center text-lg pt-1">
                  <span class="font-bold text-white">Teslim Edilen Toplam:</span>
                  <span class="text-3xl font-black text-emerald-400">${(state.cartItems || []).reduce((acc, i) => acc + i.quantity, 0)} Adet Ürün</span>
                </div>
              `}
            </div>
            <p class="text-sm text-blue-300 font-semibold mt-5">🧾 Fişiniz basılıyor, lütfen fişinizi almayı unutmayınız.</p>
          </div>
        `;
        return;
      }

      // 2. CHECKOUT STAGE
      if (state.status === 'checkout') {
        const mode = state.paymentInfo?.mode || 'CARD';
        const isCash = mode === 'CASH';
        const given = state.paymentInfo?.givenCash || 0;
        const change = state.paymentInfo?.changeDue || 0;

        const itemsHtml = (state.cartItems || []).map(item => `
          <div class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.05] border border-white/[0.1] text-sm">
            <div class="flex-1 min-w-0 pr-3">
              <div class="font-black text-white text-base truncate">${item.productName}</div>
              ${!state.hidePrices ? `
                <div class="text-xs text-blue-300/80 font-medium">
                  ${item.quantity} Adet × 
                  ${item.originalPrice && item.originalPrice > item.unitPrice ? `
                    <span class="line-through text-slate-400 mr-1">${Number(item.originalPrice).toFixed(2)} ₺</span>
                    <span class="text-rose-300 font-bold">${Number(item.unitPrice).toFixed(2)} ₺</span>
                  ` : `
                    <span>${Number(item.unitPrice).toFixed(2)} ₺</span>
                  `}
                </div>
              ` : `<div class="text-xs text-blue-300/80 font-medium">${item.quantity} Adet</div>`}
            </div>
            ${!state.hidePrices ? `<span class="font-black font-mono text-white text-base shrink-0">${Number(item.totalPrice).toFixed(2)} ₺</span>` : ''}
          </div>
        `).join('');

        main.innerHTML = `
          <div class="flex-1 flex overflow-hidden gap-4 md:gap-5 min-h-0">
            <!-- Left 58%: Interactive Payment Stage -->
            <div class="flex-[3] flex flex-col bg-slate-900/60 border border-white/15 rounded-3xl overflow-hidden backdrop-blur-2xl shadow-2xl min-h-0 animate-panel-left">
              <div class="px-6 py-4 border-b border-white/10 bg-white/[0.04] flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3.5">
                  <div class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg font-black text-xl">
                    💳
                  </div>
                  <div>
                    <span class="text-[11px] font-black text-blue-300 uppercase tracking-widest block">GÜVENLİ İŞLEM</span>
                    <h2 class="text-lg md:text-xl font-black text-white tracking-tight">Ödeme & Tahsilat Aşaması</h2>
                  </div>
                </div>
                <div class="flex items-center space-x-2.5">
                  <span class="w-3 h-3 rounded-full bg-blue-400 animate-ping"></span>
                  <span class="px-4 py-1.5 rounded-full bg-blue-500/25 text-blue-200 border border-blue-400/40 text-xs md:text-sm font-black uppercase">
                    ${isCash ? 'Nakit Ödeme' : mode === 'CARD' ? 'Kart / Temassız' : 'Parçalı Ödeme'}
                  </span>
                </div>
              </div>

              <div class="flex-1 flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
                ${isCash ? `
                  <div class="w-full max-w-lg space-y-5">
                    <div class="relative mx-auto w-24 h-24 flex items-center justify-center">
                      <div class="absolute inset-0 rounded-3xl bg-amber-500/20 animate-emerald-ring"></div>
                      <div class="w-20 h-20 rounded-3xl bg-amber-500/20 border-2 border-amber-400/50 flex items-center justify-center text-4xl shadow-xl">
                        🪙
                      </div>
                    </div>
                    <div>
                      <h3 class="text-3xl font-black text-white tracking-tight">Nakit Tahsilat Yapılıyor</h3>
                      <p class="text-base text-blue-200/90 font-medium mt-1.5">Lütfen nakit ödemenizi kasa görevlisine iletiniz.</p>
                    </div>
                    ${!state.hidePrices ? `
                      <div class="grid grid-cols-2 gap-4 pt-2">
                        <div class="bg-white/[0.06] border border-white/10 p-5 rounded-2xl">
                          <span class="text-xs font-bold text-blue-200 uppercase tracking-wider block">Alınan Tutar</span>
                          <span class="text-3xl font-black font-mono text-white mt-1.5 block">${Number(given).toFixed(2)} ₺</span>
                        </div>
                        <div class="bg-emerald-500/20 border-2 border-emerald-400/60 p-5 rounded-2xl animate-emerald-ring">
                          <span class="text-xs font-black text-emerald-200 uppercase tracking-wider block">Para Üstü</span>
                          <span class="text-3xl font-black font-mono text-emerald-300 mt-1.5 block">${Number(change).toFixed(2)} ₺</span>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                ` : `
                  <div class="w-full max-w-lg space-y-5">
                    <div class="relative mx-auto w-28 h-28 flex items-center justify-center">
                      <div class="absolute inset-0 rounded-full bg-blue-500/20 animate-soft-ring"></div>
                      <div class="absolute -inset-2 rounded-full border border-blue-400/30 animate-ping duration-1000"></div>
                      <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-blue-600 to-blue-800 border-2 border-blue-400 flex items-center justify-center text-white text-4xl shadow-2xl shadow-blue-900/50">
                        📶
                      </div>
                    </div>
                    <div class="space-y-2">
                      <span class="px-3.5 py-1 rounded-full bg-blue-500/20 text-blue-200 border border-blue-400/40 text-xs font-black uppercase inline-block">
                        TEMASSIZ VEYA ÇİPLİ İŞLEM
                      </span>
                      <h3 class="text-2xl md:text-3xl font-black text-white tracking-tight">
                        Lütfen Kartınızı POS Cihazına Yaklaştırınız
                      </h3>
                      <p class="text-base text-blue-200/90 font-medium max-w-sm mx-auto">
                        Kartınızı terminale yaklaştırabilir veya çipli olarak cihaza yerleştirebilirsiniz.
                      </p>
                    </div>
                    ${state.selectedCustomer ? `
                      <div class="bg-white/[0.08] border border-white/15 p-3 rounded-2xl inline-flex items-center space-x-2 text-sm text-white font-bold backdrop-blur-md shadow-lg">
                        <span>✨ Sayın ${state.selectedCustomer.firstName} ${state.selectedCustomer.lastName} • İyi Günlerde Kullanınız</span>
                      </div>
                    ` : ''}
                    <div class="pt-2 flex flex-wrap items-center justify-center gap-2.5">
                      <span class="px-3.5 py-1.5 rounded-xl bg-white/[0.08] border border-white/15 text-xs font-extrabold text-white">Troy</span>
                      <span class="px-3.5 py-1.5 rounded-xl bg-white/[0.08] border border-white/15 text-xs font-extrabold text-white">Visa</span>
                      <span class="px-3.5 py-1.5 rounded-xl bg-white/[0.08] border border-white/15 text-xs font-extrabold text-white">Mastercard</span>
                      <span class="px-3.5 py-1.5 rounded-xl bg-white/[0.08] border border-white/15 text-xs font-extrabold text-white">Apple / Mobil Pay</span>
                    </div>
                  </div>
                `}
              </div>

              <div class="px-5 py-2 bg-white/[0.03] border-t border-white/10 text-xs text-blue-300/90 font-medium flex items-center justify-between shrink-0">
                <span class="flex items-center space-x-1.5">
                  <span>🛡️</span>
                  <span>256-bit Uçtan Uca Şifreli Güvenli Tahsilat</span>
                </span>
                <span class="font-bold text-white text-xs">${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} Ürün</span>
              </div>
            </div>

            <!-- Right 42%: Order Summary & Giant Amount Due Card -->
            <div class="flex-[2] flex flex-col justify-between space-y-2.5 min-h-0 animate-panel-right">
              <div class="bg-slate-900/55 border border-white/15 rounded-2xl p-3.5 md:p-4 backdrop-blur-2xl shadow-xl flex-1 flex flex-col min-h-0">
                <div class="flex items-center justify-between pb-2 border-b border-white/10 mb-2 shrink-0">
                  <span class="text-xs font-black text-blue-200 uppercase tracking-wider flex items-center space-x-1.5">
                    <span>🧾</span>
                    <span>Sipariş Özeti</span>
                  </span>
                  <span class="text-xs font-bold text-blue-300/80">${state.cartItems.length} Kalem</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-0 no-scrollbar">
                  ${itemsHtml}
                </div>
                ${!state.hidePrices ? `
                  <div class="pt-2 border-t border-white/10 space-y-1 text-xs md:text-sm shrink-0">
                    <div class="flex justify-between text-blue-200/90 font-medium">
                      <span>Ara Toplam:</span>
                      <span class="font-bold text-white text-sm md:text-base">${Number(state.subtotal).toFixed(2)} ₺</span>
                    </div>
                    ${state.discountAmount > 0 ? `
                      <div class="flex justify-between text-amber-300 font-bold">
                        <span>İndirim Tutarı:</span>
                        <span>-${Number(state.discountAmount).toFixed(2)} ₺</span>
                      </div>
                    ` : ''}
                    ${(state.surchargeAmount || 0) > 0 ? `
                      <div class="flex justify-between text-orange-400 font-bold">
                        <span>Taksit / Vade Farkı:</span>
                        <span>+${Number(state.surchargeAmount).toFixed(2)} ₺</span>
                      </div>
                    ` : ''}
                  </div>
                ` : `
                  <div class="pt-2 border-t border-white/10 text-xs md:text-sm shrink-0 flex justify-between text-blue-200/90 font-medium">
                    <span>Toplam Parça:</span>
                    <span class="font-bold text-white text-sm md:text-base">${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} Adet</span>
                  </div>
                `}
              </div>

              <div class="bg-gradient-to-br from-[#00268A]/90 via-[#0a359e]/80 to-[#1e3a8a]/70 border-2 border-blue-400/60 rounded-2xl p-3.5 md:p-4 text-center shadow-xl backdrop-blur-xl text-white shrink-0">
                <span class="text-xs md:text-sm font-black text-blue-200 uppercase tracking-widest block mb-0.5">
                  ${!state.hidePrices ? 'ÖDENECEK TOPLAM TUTAR' : 'TOPLAM ÜRÜN ADEDİ'}
                </span>
                <div class="text-4xl md:text-5xl font-black text-white tracking-tight drop-shadow-md">
                  ${!state.hidePrices ? `${Number(state.total).toFixed(2)} <span class="text-2xl md:text-3xl text-blue-200 font-bold">₺</span>` : `${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} <span class="text-2xl text-blue-200 font-bold">ADET</span>`}
                </div>
                <div class="text-xs text-blue-200 font-semibold mt-1">${!state.hidePrices ? 'Net Tutar' : 'Stok Çıkış Listesi'}</div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // 3. ACTIVE CART (STREAMLINED TRANSLUCENT LOOK)
      if (state.cartItems && state.cartItems.length > 0) {
        const itemsHtml = state.cartItems.map((item, idx) => {
          const isLast = idx === state.cartItems.length - 1;
          const color = item.attributes?.color || '';
          const size = item.attributes?.size || '';
          const isDiscounted = item.originalPrice && item.originalPrice > item.unitPrice;
          return `
            <div class="p-2.5 md:p-3 rounded-xl border flex items-center justify-between transition-all ${isLast ? 'bg-blue-500/20 border-blue-400/60 shadow-md ring-1 ring-blue-400/40' : 'bg-white/[0.04] border-white/10 hover:bg-white/[0.08]'}">
              <div class="flex-1 mr-3 min-w-0">
                <div class="flex items-center space-x-2">
                  <h3 class="text-base md:text-lg font-black text-white truncate leading-snug">${item.productName}</h3>
                  ${isLast ? '<span class="px-2 py-0.5 rounded-full bg-blue-500/40 text-blue-100 border border-blue-400/50 text-[10px] font-black uppercase shrink-0 shadow-2xs">Yeni</span>' : ''}
                </div>
                <div class="flex items-center space-x-2 mt-1 text-xs text-blue-200/80">
                  ${(color || size) ? `<span class="px-2.5 py-0.5 rounded-md bg-white/10 text-white font-bold border border-white/15 text-xs">${color || '-'} / ${size || '-'}</span>` : ''}
                  ${item.barcode ? `<span class="font-mono text-blue-300 font-semibold text-xs">${item.barcode}</span>` : ''}
                </div>
              </div>
              <div class="text-right flex items-center space-x-3 shrink-0">
                <div class="text-center bg-white/10 px-3 py-1.5 rounded-xl border border-white/15 min-w-[50px]">
                  <span class="text-[10px] text-blue-200 uppercase block font-black">Adet</span>
                  <span class="text-xl md:text-2xl font-black text-white">${item.quantity}</span>
                </div>
                ${!state.hidePrices ? `
                  <div class="text-right min-w-[105px]">
                    ${isDiscounted ? `
                      <div class="flex flex-col items-end">
                        <span class="text-[11px] text-rose-300 line-through font-medium leading-none">${Number(item.originalPrice).toFixed(2)} ₺</span>
                        <span class="text-[11px] text-emerald-300 font-bold leading-tight">İndirimli: ${Number(item.unitPrice).toFixed(2)} ₺</span>
                      </div>
                    ` : `
                      <span class="text-xs text-blue-200/80 block font-medium">Birim: ${Number(item.unitPrice).toFixed(2)} ₺</span>
                    `}
                    <span class="text-xl md:text-2xl font-black text-white">${Number(item.totalPrice).toFixed(2)} ₺</span>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');

        let campaignHtml = '';
        if (!state.hidePrices && state.activeCampaign) {
          campaignHtml = `
            <div class="bg-amber-500/20 border border-amber-400/40 rounded-xl p-2.5 flex items-center justify-between backdrop-blur-xl shadow-xs shrink-0">
              <div class="flex items-center space-x-2">
                <span class="p-1.5 rounded-lg bg-amber-500/30 text-amber-300 border border-amber-400/40 text-xs">🏷️</span>
                <div>
                  <span class="text-[10px] font-black text-amber-300 uppercase tracking-wide block leading-none">Kampanya</span>
                  <span class="text-sm font-black text-white leading-tight">${state.activeCampaign.name}</span>
                </div>
              </div>
              ${state.discountAmount > 0 ? `<span class="text-sm font-black text-amber-200 bg-amber-400/30 px-2.5 py-0.5 rounded-lg border border-amber-400/40">-${Number(state.discountAmount).toFixed(2)} ₺</span>` : ''}
              ${(state.surchargeAmount || 0) > 0 ? `<span class="text-sm font-black text-orange-200 bg-orange-500/30 px-2.5 py-0.5 rounded-lg border border-orange-400/40">+${Number(state.surchargeAmount).toFixed(2)} ₺</span>` : ''}
            </div>
          `;
        }

        const rightPanelHtml = state.hidePrices ? `
          <div class="bg-slate-900/55 border border-white/15 rounded-2xl p-4 md:p-5 backdrop-blur-2xl space-y-3.5 shadow-xl flex-1 flex flex-col justify-between">
            <div class="space-y-3">
              <div class="flex items-center space-x-2 text-rose-300 border-b border-white/10 pb-2.5">
                <span class="text-lg">🛍️</span>
                <span class="text-sm font-black uppercase tracking-wider">Ürün & Stok Bilgisi</span>
              </div>
              <div class="space-y-2 text-sm text-blue-100">
                <div class="flex justify-between items-center bg-white/[0.04] p-3 rounded-xl border border-white/10">
                  <span class="text-blue-200 font-semibold">Toplam Çeşit:</span>
                  <span class="font-black text-white text-base">${state.cartItems.length} Kalem</span>
                </div>
                <div class="flex justify-between items-center bg-white/[0.04] p-3 rounded-xl border border-white/10">
                  <span class="text-blue-200 font-semibold">Toplam Ürün Adedi:</span>
                  <span class="font-black text-white text-base">${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} Adet</span>
                </div>
              </div>
            </div>
            <div class="bg-gradient-to-br from-[#00268A]/90 via-[#0a359e]/80 to-[#1e3a8a]/70 border-2 border-blue-400/60 rounded-2xl p-3.5 md:p-4 text-center shadow-xl backdrop-blur-xl text-white shrink-0">
              <span class="text-xs font-black text-blue-200 uppercase tracking-widest block mb-0.5">SEPETTEKİ TOPLAM ÜRÜN</span>
              <div class="text-4xl md:text-5xl font-black text-white tracking-tight drop-shadow-md">
                ${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} <span class="text-2xl text-blue-200 font-bold">ADET</span>
              </div>
              <div class="text-[11px] text-blue-200 font-semibold mt-1">Stok Çıkış Listesi</div>
            </div>
          </div>
        ` : `
          ${campaignHtml}
          <div class="bg-slate-900/55 border border-white/15 rounded-2xl p-3.5 md:p-4 backdrop-blur-2xl space-y-2.5 shadow-xl flex-1 flex flex-col justify-between">
            <div class="space-y-1.5 pb-2 border-b border-white/10 shrink-0 text-xs md:text-sm">
              <div class="flex justify-between items-center text-sm md:text-base">
                <span class="text-blue-200 font-semibold">Ara Toplam</span>
                <span class="font-black text-white text-base md:text-lg">${Number(state.subtotal).toFixed(2)} ₺</span>
              </div>
              ${state.discountAmount > 0 ? `
                <div class="flex justify-between items-center text-sm md:text-base text-amber-300 font-black">
                  <span class="flex items-center space-x-1.5">
                    <span>🏷️</span>
                    <span>İndirim Tutarı</span>
                  </span>
                  <span class="text-base md:text-lg">-${Number(state.discountAmount).toFixed(2)} ₺</span>
                </div>
              ` : ''}
              ${(state.surchargeAmount || 0) > 0 ? `
                <div class="flex justify-between items-center text-sm md:text-base text-orange-400 font-black">
                  <span class="flex items-center space-x-1.5">
                    <span>💳</span>
                    <span>Taksit / Vade Farkı</span>
                  </span>
                  <span class="text-base md:text-lg">+${Number(state.surchargeAmount).toFixed(2)} ₺</span>
                </div>
              ` : ''}
            </div>

            <div class="bg-gradient-to-br from-[#00268A]/90 via-[#0a359e]/80 to-[#1e3a8a]/70 border-2 border-blue-400/60 rounded-2xl p-3.5 md:p-4 text-center shadow-xl backdrop-blur-xl text-white shrink-0">
              <span class="text-xs font-black text-blue-200 uppercase tracking-widest block mb-0.5">ÖDENECEK TOPLAM TUTAR</span>
              <div class="text-4xl md:text-5xl font-black text-white tracking-tight drop-shadow-md">
                ${Number(state.total).toFixed(2)} <span class="text-2xl md:text-3xl text-blue-200 font-bold">₺</span>
              </div>
            </div>

            <div class="text-center shrink-0 pt-0.5">
              <div class="inline-flex items-center space-x-2 px-3 py-0.5 rounded-full bg-white/[0.06] border border-white/10 text-[11px] md:text-xs text-blue-200/90 font-medium">
                <span>💳 Nakit, Kredi Kartı ve Temassız Geçerlidir</span>
              </div>
            </div>
          </div>
        `;

        main.innerHTML = `
          <div class="flex-1 flex overflow-hidden gap-3.5 md:gap-4 min-h-0">
            <!-- Left 58%: Real-Time Cart Items List -->
            <div class="flex-[3] flex flex-col bg-slate-900/55 border border-white/15 rounded-2xl overflow-hidden backdrop-blur-2xl shadow-xl min-h-0 animate-panel-left">
              <div class="px-5 py-2.5 border-b border-white/10 bg-white/[0.04] flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2.5">
                  <span class="text-xl">🛍️</span>
                  <h2 class="text-lg md:text-xl font-black text-white tracking-wide">Alışveriş Sepetiniz</h2>
                </div>
                <span class="px-3 py-0.5 rounded-full bg-blue-500/25 text-blue-200 border border-blue-400/40 text-xs font-black">
                  ${state.cartItems.reduce((acc, i) => acc + i.quantity, 0)} Ürün
                </span>
              </div>
              <div class="flex-1 overflow-y-auto p-3 space-y-2.5 min-h-0 no-scrollbar" id="itemsScrollBox">
                ${itemsHtml}
              </div>
            </div>

            <!-- Right 42%: Financial Summary & Total Box -->
            <div class="flex-[2] flex flex-col justify-between space-y-2.5 min-h-0 overflow-y-auto animate-panel-right">
              ${rightPanelHtml}
            </div>
          </div>
        setTimeout(() => {
          const box = document.getElementById('itemsScrollBox');
          if (box) box.scrollTop = box.scrollHeight;
        }, 50);
        return;
      }

      // 4. STANDBY / IDLE STATE (WELCOME SCREEN - PROPORTIONATE 13.3" & ALL DISPLAYS)
      const p = PROMOS[promoIdx];
      main.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-between p-4 md:p-6 lg:p-7 border border-white/20 rounded-3xl shadow-2xl relative overflow-hidden animate-slowmotion-fade gap-3 md:gap-4">
          <!-- Cinematic Store Atmosphere Background Image -->
          <div class="absolute inset-0 z-0">
            <img
              src="./customerbackground.jpg"
              onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='/customerbackground.jpg';}"
              alt="Karşılama Arka Planı"
              class="w-full h-full object-cover object-center scale-100 filter brightness-[0.92] contrast-[1.05]"
            />
            <!-- High-transparency subtle gradient overlay so the background image is clearly visible -->
            <div class="absolute inset-0 bg-gradient-to-t from-[#060c1c]/70 via-[#0c1a38]/25 to-[#060c1c]/45"></div>
          </div>

          <!-- Welcome Message -->
          <div class="text-center space-y-2 md:space-y-2.5 z-10 max-w-3xl shrink-0 pt-1.5">
            <div>
              <span class="px-5 py-1.5 rounded-full bg-blue-500/30 text-blue-100 border border-blue-400/50 text-xs md:text-sm font-black tracking-widest uppercase inline-block shadow-lg backdrop-blur-md">
                PREMIUM RETAIL EXPERIENCE
              </span>
            </div>
            <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white tracking-tight leading-tight drop-shadow-2xl">
              Hoş Geldiniz
            </h2>
            <p class="text-base md:text-lg text-blue-100 font-bold drop-shadow-lg max-w-2xl mx-auto">
              Yeni sezon koleksiyonumuz ve ayrıcalıklı alışveriş deneyimi için buradayız.
            </p>
          </div>

          <!-- Auto-Rotating Campaign Banner -->
          <div class="w-full max-w-2xl z-10 shrink-0">
            <div class="bg-slate-900/50 border border-white/25 rounded-2xl md:rounded-3xl p-4 md:p-5 backdrop-blur-xl shadow-2xl transition-all duration-500">
              <div class="flex items-start space-x-3.5 md:space-x-4">
                <div class="p-3 md:p-3.5 rounded-2xl ${p.iconBg} shadow-lg text-2xl md:text-3xl shrink-0 border border-white/20">
                  ${p.icon}
                </div>
                <div class="flex-1 space-y-1.5">
                  <span class="px-3 py-0.5 rounded-full text-xs font-black uppercase tracking-wider border inline-block ${p.badgeColor}">
                    ${p.badge}
                  </span>
                  <h3 class="text-2xl md:text-3xl font-black text-white tracking-tight drop-shadow-md">
                    ${p.title}
                  </h3>
                  <p class="text-xs md:text-sm text-blue-100 font-semibold leading-relaxed drop-shadow-sm">
                    ${p.subtitle}
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Sleek Compact Single-Line Bottom Badge Row -->
          <div class="z-10 flex flex-wrap items-center justify-center gap-3 text-xs md:text-sm font-bold text-blue-100/90 shrink-0 pb-1">
            <span class="px-4 py-1.5 md:px-5 md:py-2 rounded-full bg-slate-900/60 border border-white/20 backdrop-blur-md flex items-center gap-2 shadow-md">
              <span>💳</span> Nakit & Tüm Banka Kartları
            </span>
            <span class="px-4 py-1.5 md:px-5 md:py-2 rounded-full bg-slate-900/60 border border-white/20 backdrop-blur-md flex items-center gap-2 shadow-md">
              <span>🔄</span> 14 Gün İçinde Fiş ile Değişim
            </span>
          </div>
        </div>
      `;
    }

    render();

    // SSE Realtime Sync
    try {
      const evt = new EventSource('/api/customer-display/events');
      evt.onmessage = (e) => {
        try {
          const payload = JSON.parse(e.data);
          state = { ...state, ...payload };
          render();
        } catch (err) {
          console.error('SSE JSON error', err);
        }
      };
    } catch (err) {
      console.warn('SSE connect fail', err);
    }

    // BroadcastChannel Realtime Sync
    try {
      const bc = new BroadcastChannel('pos_customer_display');
      bc.onmessage = (ev) => {
        if (ev.data) {
          state = { ...state, ...ev.data };
          render();
        }
      };
    } catch (e) { }

    // Polling fallback
    setInterval(async () => {
      try {
        const res = await fetch('/api/customer-display/state');
        if (res.ok) {
          const data = await res.json();
          if (JSON.stringify(data) !== JSON.stringify(state)) {
            state = { ...state, ...data };
            render();
          }
        }
      } catch (e) { }
    }, 2000);
  </script>
</body>

</html>
